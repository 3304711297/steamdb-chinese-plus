name: CI

# push / PR 时验证:构建可复现、语法正确、已提交产物与源一致、模块单元测试通过。
# 与 upstream-sync(定时)互补:上游同步只管词库更新,这里管人改的代码不把仓库改坏。

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: 构建产物并校验语法
        run: |
          node build.mjs
          node --check steamdb-chinese-plus.user.js

      # 防止手改 sources/ 或模块后忘记重新构建就提交,
      # 导致线上产物与仓库源不一致
      - name: 校验已提交产物与源一致
        run: git diff --exit-code -- steamdb-chinese-plus.user.js

      - name: 单元测试
        run: node --test tests/engine-dom.test.mjs tests/i18n-core.test.mjs tests/word-priority.test.mjs tests/check-upstream.test.mjs tests/build.test.mjs
