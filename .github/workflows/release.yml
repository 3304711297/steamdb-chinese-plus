name: Release

# 当推送 v* 标签时触发发布工作流:
# 1. 检出代码
# 2. 配置 Node.js 24 LTS
# 3. 使用 --channel=stable 构建稳定版产物
# 4. 创建 GitHub Release 并上传单文件 userscript 产物

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: 构建稳定版产物并校验
        run: |
          node build.mjs --channel=stable
          node --check steamdb-chinese-plus.user.js

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: steamdb-chinese-plus.user.js
          generate_release_notes: true
