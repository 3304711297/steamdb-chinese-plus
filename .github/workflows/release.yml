name: Release

# 当推送 v* 标签时触发发布工作流:
# 1. 检出代码
# 2. 配置 Node.js 24 LTS
# 3. 使用 --channel=stable 构建稳定版产物
# 4. 创建 GitHub Release 并上传单文件 userscript 产物

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: 构建稳定版产物并校验
        run: |
          node build.mjs --channel=stable
          node --check steamdb-chinese-plus.user.js

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: steamdb-chinese-plus.user.js
          generate_release_notes: true
